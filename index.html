<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<meta name="description" content="Watch live TV channels in one place.">
<title>KP Live TV</title>
<style>
:root{color-scheme:dark;--bg:#080808;--surface:#151515;--surface2:#202020;--text:#f5f5f1;--muted:#aaa;--red:#e50914;--border:#292929;--accent:#e50914}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Arial,Helvetica,sans-serif;padding-bottom:76px}
button,input,select{font:inherit}
button{cursor:pointer}
a{color:inherit}

.site-header{position:fixed;z-index:30;top:0;left:0;right:0;background:rgba(8,8,8,.94);backdrop-filter:blur(10px);border-bottom:1px solid #1a1a1a}
.nav{max-width:1600px;margin:auto;min-height:68px;padding:0 3.5%;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;font-size:24px;font-weight:900;color:var(--accent);white-space:nowrap}
.nav-spacer{flex:1}
.search-wrap{display:flex;align-items:center;gap:8px;border:1px solid #333;background:#141414;border-radius:20px;padding:6px 14px}
.search-wrap input{width:140px;border:0;outline:0;background:transparent;color:#fff}
.category-open-trigger{background:#1c1c1c;color:#fff;border:1px solid #333;border-radius:20px;padding:7px 14px;cursor:pointer}

.player-section{width:100%;padding:82px 3.5% 12px;background:var(--bg)}
.player-container{width:100%;max-width:1300px;margin:0 auto}
.hero-player{width:100%;border-radius:14px;overflow:hidden;background:#121212;border:1px solid var(--border);box-shadow:0 12px 35px #000a}
.player-top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#1a1a1a}
.now strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now small{color:#aaa;font-size:12px}
.live-badge{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;color:#fff}
.live-dot{width:7px;height:7px;background:var(--accent);border-radius:50%}

.video-stage{position:relative;overflow:hidden;background:#000;width:100%;aspect-ratio:16/9;max-height:60vh}
.video-stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.video-tools{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:8px;padding:8px 12px;background:linear-gradient(transparent,rgba(0,0,0,.85));transition:opacity .2s}
.video-tools button{background:transparent;border:0;color:#fff;font-size:18px;padding:6px;border-radius:4px}
.video-tools input[type="range"]{width:70px;accent-color:var(--accent)}
.video-stage.controls-hidden .video-tools{opacity:0;pointer-events:none}
.player-bottom{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;font-size:12px;color:#888;background:#141414}

.category-tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:14px 3.5%;max-width:1600px;margin:auto}
.category-tabs::-webkit-scrollbar{display:none}
.category-tab{flex:0 0 auto;border:0;border-radius:20px;background:#202020;color:#ddd;padding:8px 16px;font-size:13px;font-weight:700}
.category-tab.active{background:var(--accent);color:#fff}

.rows{max-width:1600px;margin:0 auto;padding:0 3.5% 30px}
.category-row{margin:15px 0 25px}
.row-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.row-heading h2{font-size:19px;margin:0;font-weight:800}

.rail{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.channel-card{position:relative;display:flex;flex-direction:column;border:1px solid #282828;border-radius:10px;background:#191919;overflow:hidden;cursor:pointer;transition:transform .15s}
.channel-card:hover{transform:translateY(-3px);border-color:#444}
.channel-card.active{border:2px solid var(--accent)}
.card-art{aspect-ratio:1/1;display:grid;place-items:center;background:#111;position:relative}
.card-art img{width:70%;height:70%;object-fit:contain}
.logo-fallback{font-weight:900;font-size:22px;color:#666;text-align:center;padding:10px}
.card-info{padding:8px;text-align:center;background:#1f1f1f}
.card-name{display:block;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav-mark{position:absolute;top:6px;left:6px;width:24px;height:24px;border-radius:50%;background:#0008;color:#fff;display:grid;place-items:center;font-size:14px}
.fav-mark.active{color:var(--accent)}

.load-more-container{text-align:center;margin:25px 0}
.load-more-btn{background:#222;border:1px solid #383838;color:#fff;padding:10px 24px;border-radius:24px;font-weight:700}
.mobile-dock{position:fixed;z-index:60;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:8px 0;background:#141416;border-top:1px solid #28282c}
.dock-item{background:none;border:0;color:#888;display:flex;flex-direction:column;align-items:center;font-size:10px}
.dock-item.active{color:var(--accent)}
.dock-item span{font-size:18px}
.empty{padding:25px;background:#161616;border-radius:8px;text-align:center;color:#999}
@media(max-width:600px){
  .rail{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .search-wrap input{width:90px}
}
</style>
</head>
<body>

<header class="site-header">
  <nav class="nav">
    <a class="brand" href="#" id="siteBrandTitle">KP Live TV</a>
    <div class="nav-spacer"></div>
    <label class="search-wrap">
      <span>⌕</span>
      <input id="search" type="search" placeholder="Search…">
    </label>
    <button class="category-open-trigger" id="categoryTrigger" type="button">All Categories ⌄</button>
  </nav>
</header>

<section class="player-section" id="playerWrap">
  <div class="player-container">
    <div class="hero-player">
      <div class="player-top">
        <div class="now"><strong id="nowTitle">Select a channel to play</strong><small id="nowGroup">Live TV</small></div>
        <span class="live-badge"><span class="live-dot"></span> LIVE</span>
      </div>
      <div class="video-stage" id="videoStage">
        <video id="video" playsinline webkit-playsinline></video>
        <div class="video-tools" id="videoTools">
          <button id="playPause" type="button">▶</button>
          <button id="muteBtn" type="button">🔊</button>
          <input id="volumeLevel" type="range" min="0" max="1" step="0.05" value="1">
          <button id="fullScreenBtn" type="button" style="margin-left:auto">⛶</button>
        </div>
      </div>
      <div class="player-bottom">
        <span id="playState">Ready</span>
        <button id="stopBtn" style="background:#222;border:1px solid #444;color:#fff;padding:4px 8px;border-radius:4px" type="button">Stop</button>
      </div>
    </div>
  </div>
</section>

<div class="category-tabs" id="categoryTabs"></div>

<main class="rows">
  <div id="channelRows"></div>
  <div class="load-more-container">
    <button id="loadMoreBtn" class="load-more-btn" style="display:none" type="button">Load More Channels</button>
  </div>
</main>

<nav class="mobile-dock">
  <button class="dock-item active" id="dockHome" type="button"><span>⌂</span>Home</button>
  <button class="dock-item" id="dockFavs" type="button"><span>♡</span>Favorites</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),video=$('video');
let channels=[],activeId=null,hls=null,activeFilter='All',currentQuery='',pageLimit=48;
let favs=JSON.parse(localStorage.getItem('kp-favs')||'[]');
const db=window.supabase?.createClient(window.KP_SUPABASE_URL||'',window.KP_SUPABASE_ANON_KEY||'');

function debounce(fn,ms=250){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}

// Optimized Chunk Fetch for 2,000 Channels
async function fetchAllChannels(){
  const cached=localStorage.getItem('kp-channels-cache');
  if(cached){
    try{
      const parsed=JSON.parse(cached);
      if(Array.isArray(parsed)&&parsed.length){channels=parsed;renderCategories();renderChannels(true)}
    }catch{}
  }
  if(!db)return;
  let all=[],page=0,step=1000,done=false;
  try{
    while(!done){
      const {data,error}=await db.from('kp_channels')
        .select('id,name,category,logo_url,stream_urls')
        .eq('is_active',true)
        .order('sort_order',{ascending:true})
        .range(page*step,(page+1)*step-1);
      if(error)break;
      if(data&&data.length){
        all.push(...data);
        if(data.length<step)done=true;
        else page++;
      }else done=true;
    }
    if(all.length){
      channels=all.map(c=>({
        id:c.id,name:c.name,group:c.category||'Other',logo:c.logo_url,
        urls:(c.stream_urls||[]).map(u=>typeof u==='string'?u:u.url).filter(Boolean)
      }));
      localStorage.setItem('kp-channels-cache',JSON.stringify(channels));
      renderCategories();
      renderChannels(true);
    }
  }catch(e){console.error('Channel load error:',e)}
}

function renderCategories(){
  const groups=['All',...new Set(channels.map(c=>c.group).filter(Boolean))];
  const tabs=$('categoryTabs');tabs.innerHTML='';
  groups.forEach(g=>{
    const b=document.createElement('button');b.className='category-tab'+(g===activeFilter?' active':'');
    b.textContent=g;
    b.onclick=()=>{activeFilter=g;$('search').value='';currentQuery='';tabs.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));renderChannels(true)};
    tabs.appendChild(b);
  });
}

function makeCard(channel){
  const card=document.createElement('div');
  card.className='channel-card'+(channel.id===activeId?' active':'');
  const isFav=favs.includes(channel.id);
  card.innerHTML=`
    <div class="card-art">
      ${channel.logo?`<img src="${channel.logo}" loading="lazy" decoding="async" alt="${channel.name}" onerror="this.outerHTML='<span class=\\'logo-fallback\\'>${channel.name.slice(0,2).toUpperCase()}</span>'">`:`<span class="logo-fallback">${channel.name.slice(0,2).toUpperCase()}</span>`}
      <span class="fav-mark ${isFav?'active':''}">${isFav?'♥':'♡'}</span>
    </div>
    <div class="card-info"><span class="card-name">${channel.name}</span></div>
  `;
  card.querySelector('.fav-mark').onclick=(e)=>{
    e.stopPropagation();
    if(favs.includes(channel.id))favs=favs.filter(x=>x!==channel.id);
    else favs.push(channel.id);
    localStorage.setItem('kp-favs',JSON.stringify(favs));
    renderChannels(false);
  };
  card.onclick=()=>play(channel);
  return card;
}

function renderChannels(reset=false){
  if(reset)pageLimit=48;
  const root=$('channelRows');
  if(reset)root.innerHTML='';

  let list=channels;
  if(activeFilter==='__FAVS__')list=channels.filter(c=>favs.includes(c.id));
  else if(activeFilter!=='All')list=channels.filter(c=>c.group===activeFilter);

  if(currentQuery)list=list.filter(c=>c.name.toLowerCase().includes(currentQuery)||(c.group||'').toLowerCase().includes(currentQuery));

  if(!list.length){
    root.innerHTML='<div class="empty">No channels found.</div>';
    $('loadMoreBtn').style.display='none';
    return;
  }

  const paged=list.slice(0,pageLimit);
  let rail=root.querySelector('.rail');
  if(!rail){
    rail=document.createElement('div');
    rail.className='rail';
    root.appendChild(rail);
  }
  rail.innerHTML='';
  const frag=document.createDocumentFragment();
  paged.forEach(c=>frag.appendChild(makeCard(c)));
  rail.appendChild(frag);

  $('loadMoreBtn').style.display=list.length>pageLimit?'inline-block':'none';
  if(list.length>pageLimit)$('loadMoreBtn').textContent=`Load More (${list.length-pageLimit} remaining)`;
}

$('loadMoreBtn').onclick=()=>{pageLimit+=48;renderChannels(false)};
$('search').oninput=debounce(e=>{currentQuery=e.target.value.toLowerCase().trim();renderChannels(true)},200);

$('dockHome').onclick=()=>{activeFilter='All';$('dockHome').classList.add('active');$('dockFavs').classList.remove('active');renderChannels(true)};
$('dockFavs').onclick=()=>{activeFilter='__FAVS__';$('dockFavs').classList.add('active');$('dockHome').classList.remove('active');renderChannels(true)};

// Player Engine
function play(channel){
  activeId=channel.id;
  $('nowTitle').textContent=channel.name;
  $('nowGroup').textContent=channel.group;
  $('playState').textContent='Connecting…';
  if(hls){hls.destroy();hls=null}
  video.pause();video.removeAttribute('src');video.load();

  document.querySelectorAll('.channel-card').forEach(c=>c.classList.remove('active'));
  renderChannels(false);

  const url=channel.urls[0];
  if(!url){$('playState').textContent='No stream URL available';return}

  if(/\.m3u8($|[?#])/i.test(url)&&window.Hls&&Hls.isSupported()){
    hls=new Hls({enableWorker:true,maxBufferLength:30});
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>{video.play().catch(()=>{});$('playState').textContent='Playing live'});
    hls.on(Hls.Events.ERROR,()=>{video.play().catch(()=>{})});
  }else{
    video.src=url;video.load();video.play().catch(()=>{});$('playState').textContent='Playing live';
  }
  $('playerWrap').scrollIntoView({behavior:'smooth'});
}

$('playPause').onclick=()=>{if(video.paused)video.play();else video.pause()};
video.onplay=()=>{$('playPause').textContent='Ⅱ';$('playState').textContent='Playing live'};
video.onpause=()=>{$('playPause').textContent='▶';$('playState').textContent='Paused'};
$('muteBtn').onclick=()=>{video.muted=!video.muted;$('muteBtn').textContent=video.muted?'🔇':'🔊'};
$('volumeLevel').oninput=e=>{video.volume=Number(e.target.value);video.muted=false;$('muteBtn').textContent='🔊'};
$('stopBtn').onclick=()=>{if(hls){hls.destroy();hls=null}video.pause();video.removeAttribute('src');video.load();$('playState').textContent='Stopped'};
$('fullScreenBtn').onclick=()=>{if(!document.fullscreenElement)$('videoStage').requestFullscreen();else document.exitFullscreen()};

fetchAllChannels();
})();
</script>
</body>
</html>
